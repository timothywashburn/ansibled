---
# Container image and how to pull it: always | missing | never.
ansibled_image: ghcr.io/timothywashburn/ansibled:latest
ansibled_pull: always
ansibled_container_name: "ansibled-{{ ansibled_config.site }}"

# Host directory holding compose.yml, etc/ (config, secrets, overlay) and data/.
ansibled_dir: /opt/ansibled

# The image runs as this uid/gid; secrets, overlay and data are owned by it.
ansibled_uid: 10001
ansibled_gid: 10001

# Required: the ansibled.yml settings (see DESIGN.md "Configuration"), without
# the container paths (secret files, overlay_dir, data_dir, ansible.ssh_key_file),
# which the role sets itself. Secrets are given inline instead of as *_file keys;
# the role writes them to files and keeps them out of the rendered ansibled.yml.
# Example:
# ansibled_config:
#   site: mysite
#   public_url: http://10.0.0.1:9251
#   listen: {webhook: "10.0.0.1:9250", web: "10.0.0.1:9251"}
#   git:
#     url: https://gitlab.example.org
#     project: myorg/infra
#     trusted_group: myorg/sysadmins
#     token: glpat-...                # GitLab project access token (api, read_repository)
#     # webhook_secret: ...           # optional, generated if not given
#   web:
#     # metrics_token: ...            # optional, generated if not given
#     # session_key: ...              # optional, generated if not given
#     oidc:
#       issuer: https://auth.example.org/application/o/ansibled/
#       client_id: ...
#       client_secret: ...
#       allowed_groups: [sysadmins]
#   repo: {setup: uv sync --frozen --no-dev, venv_key_files: [pyproject.toml, uv.lock]}
#   ansible: {inventory: inventories/mysite, playbooks: [site.yml], remote_user: ansibled}
#   schedule: {nightly: "0 4 * * *", timezone: America/Los_Angeles}
#
# git.token, web.oidc.client_id and web.oidc.client_secret are needed on the
# first deploy; when left out later, the files already on the host are kept.
# git.webhook_secret, web.metrics_token and web.session_key are generated (48
# random characters) the first time when not given, and kept afterwards.

# Comment of the generated SSH key.
ansibled_ssh_key_comment: "ansibled@{{ ansibled_config.site }}"

# Files copied over every checkout, relative to the repo root:
# - {path: ansible/.vault-pass, content: "{{ vault_pass }}", mode: "0400"}
# - {path: ansible/files/state.json, src: files/state.json}
ansibled_overlay_files: []
# Delete files in the overlay directory that are not in ansibled_overlay_files.
ansibled_overlay_prune: false

# GitLab project webhook registration (runs on the controller, needs python-gitlab
# there). Enabled when ansibled_gitlab_hook_token is defined: a token with the
# Maintainer role and api scope on the project.
# ansibled_gitlab_hook_token:
ansibled_gitlab_hook_url: "http://{{ ansibled_config.listen.webhook }}/webhook/gitlab"
ansibled_gitlab_api_url: "{{ ansibled_config.git.url }}"
# Verify TLS when talking to the GitLab API.
ansibled_gitlab_validate_certs: true
# Let GitLab verify the TLS certificate of the hook URL (only matters for https).
ansibled_gitlab_hook_validate_certs: true
