---
# Role internals, not meant to be overridden.
_ansibled_managed_header: "# Managed by Ansible (timothywashburn.ansibled.ansibled). Do not edit."

# Container-side paths.
_ansibled_c_etc: /etc/ansibled
_ansibled_c_secrets: /etc/ansibled/secrets
_ansibled_c_data: /var/lib/ansibled

# Host-side paths.
_ansibled_h_etc: "{{ ansibled_dir }}/etc"
_ansibled_h_secrets: "{{ ansibled_dir }}/etc/secrets"
_ansibled_h_overlay: "{{ ansibled_dir }}/etc/overlay"
_ansibled_h_data: "{{ ansibled_dir }}/data"

# Merged over ansibled_config, so users never write these.
_ansibled_config_managed:
  git:
    token_file: "{{ _ansibled_c_secrets }}/git_token"
    webhook_secret_file: "{{ _ansibled_c_secrets }}/webhook_secret"
  ansible:
    ssh_key_file: "{{ _ansibled_c_secrets }}/ssh_key"
  overlay_dir: "{{ _ansibled_c_etc }}/overlay"
  data_dir: "{{ _ansibled_c_data }}"
  web:
    metrics_token_file: "{{ _ansibled_c_secrets }}/metrics_token"
    session_key_file: "{{ _ansibled_c_secrets }}/session_key"
    oidc:
      client_id_file: "{{ _ansibled_c_secrets }}/oidc_client_id"
      client_secret_file: "{{ _ansibled_c_secrets }}/oidc_client_secret"

# Secret values given inline in ansibled_config. The role writes them to files
# under secrets/ and leaves them out of the rendered ansibled.yml.
_ansibled_secret_values:
  git_token: "{{ ansibled_config.git.token | default('') | string }}"
  webhook_secret: "{{ ansibled_config.git.webhook_secret | default('') | string }}"
  metrics_token: "{{ ansibled_config.web.metrics_token | default('') | string }}"
  session_key: "{{ ansibled_config.web.session_key | default('') | string }}"
  oidc_client_id: "{{ ansibled_config.web.oidc.client_id | default('') | string }}"
  oidc_client_secret: "{{ ansibled_config.web.oidc.client_secret | default('') | string }}"

_ansibled_config_secret_free: >-
  {{ ansibled_config | combine({
       'git': ansibled_config.git | default({}) | dict2items
              | rejectattr('key', 'in', ['token', 'webhook_secret']) | items2dict,
       'web': ansibled_config.web | default({}) | dict2items
              | rejectattr('key', 'in', ['metrics_token', 'session_key', 'oidc']) | items2dict
              | combine({'oidc': ansibled_config.web.oidc | default({}) | dict2items
                                 | rejectattr('key', 'in', ['client_id', 'client_secret']) | items2dict}),
     }) }}
_ansibled_config_effective: "{{ _ansibled_config_secret_free | combine(_ansibled_config_managed, recursive=True) }}"

# Keys ansibled.yml accepts, per section (unknown keys are an error in ansibled).
_ansibled_config_keys:
  top: [site, public_url, listen, git, repo, ansible, schedule, retention, web]
  listen: [webhook, web]
  git: [type, url, project, trusted_group, clone_url, token, webhook_secret]
  repo: [workdir, setup, venv_key_files, collections_requirements]
  ansible: [inventory, playbooks, extra_args, remote_user, timeout, env]
  schedule: [nightly, timezone]
  web: [oidc, metrics_token, session_key]
  web.oidc: [issuer, allowed_groups, groups_claim, scopes, client_id, client_secret]

# Secret files and the ansibled_config key each one comes from. Required ones
# must be given on the first deploy; optional ones are generated when not given.
_ansibled_required_secrets:
  - {name: git_token, key: git.token}
  - {name: oidc_client_id, key: web.oidc.client_id}
  - {name: oidc_client_secret, key: web.oidc.client_secret}
_ansibled_optional_secrets:
  - {name: webhook_secret, key: git.webhook_secret}
  - {name: metrics_token, key: web.metrics_token}
  - {name: session_key, key: web.session_key}

# host:port -> (host for the healthcheck, port). Wildcard binds are probed on loopback.
_ansibled_webhook_host: "{{ ansibled_config.listen.webhook | regex_replace(':[0-9]+$', '') }}"
_ansibled_webhook_port: "{{ ansibled_config.listen.webhook | regex_search('[0-9]+$') }}"
_ansibled_health_host: >-
  {{ '127.0.0.1' if _ansibled_webhook_host in ['', '0.0.0.0']
     else '[::1]' if _ansibled_webhook_host in ['::', '[::]']
     else _ansibled_webhook_host }}
_ansibled_health_url: "http://{{ _ansibled_health_host }}:{{ _ansibled_webhook_port }}/healthz"

_ansibled_compose:
  name: "{{ ansibled_container_name }}"
  services:
    ansibled:
      image: "{{ ansibled_image }}"
      container_name: "{{ ansibled_container_name }}"
      network_mode: host
      restart: always
      user: "{{ ansibled_uid }}:{{ ansibled_gid }}"
      stop_grace_period: 60s
      volumes:
        - "{{ _ansibled_h_etc }}:{{ _ansibled_c_etc }}:ro,Z"
        - "{{ _ansibled_h_data }}:{{ _ansibled_c_data }}:Z"
      healthcheck:
        # The image has no curl.
        test:
          - CMD
          - python3
          - -c
          - "import urllib.request; urllib.request.urlopen('{{ _ansibled_health_url }}', timeout=5)"
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s

# Computed lists. The templates emit JSON so the result is a list on every
# ansible-core version (2.15 string conversion vs. 2.19 native types).
_ansibled_unknown_keys_json: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for k in ansibled_config if k not in _ansibled_config_keys.top -%}
  {%-   set ns.out = ns.out + [k] -%}
  {%- endfor -%}
  {%- for section in ['listen', 'git', 'repo', 'ansible', 'schedule', 'web'] -%}
  {%-   if ansibled_config[section] is defined and ansibled_config[section] is mapping -%}
  {%-     for k in ansibled_config[section] if k not in _ansibled_config_keys[section] -%}
  {%-       set ns.out = ns.out + [section ~ '.' ~ k] -%}
  {%-     endfor -%}
  {%-   endif -%}
  {%- endfor -%}
  {%- if ansibled_config.web is defined and ansibled_config.web is mapping
        and ansibled_config.web.oidc is defined and ansibled_config.web.oidc is mapping -%}
  {%-   for k in ansibled_config.web.oidc if k not in _ansibled_config_keys['web.oidc'] -%}
  {%-     set ns.out = ns.out + ['web.oidc.' ~ k] -%}
  {%-   endfor -%}
  {%- endif -%}
  {{- ns.out | to_json -}}
_ansibled_unknown_keys: "{{ _ansibled_unknown_keys_json | from_json }}"

_ansibled_overlay_paths: "{{ ansibled_overlay_files | map(attribute='path', default='') | list }}"
# Every parent directory of an overlay file, relative to the overlay root.
_ansibled_overlay_dirs_json: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for p in _ansibled_overlay_paths -%}
  {%-   set parts = p.split('/') -%}
  {%-   for i in range(1, parts | length) -%}
  {%-     set ns.out = ns.out + [parts[:i] | join('/')] -%}
  {%-   endfor -%}
  {%- endfor -%}
  {{- ns.out | unique | sort | to_json -}}
_ansibled_overlay_dirs: "{{ _ansibled_overlay_dirs_json | from_json }}"
