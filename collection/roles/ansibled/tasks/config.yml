---
- name: Render ansibled.yml
  ansible.builtin.template:
    src: ansibled.yml.j2
    dest: "{{ _ansibled_h_etc }}/ansibled.yml"
    owner: 0
    group: "{{ ansibled_gid }}"
    mode: "0640"
  notify: ansibled restart

- name: Render compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ ansibled_dir }}/compose.yml"
    owner: 0
    group: 0
    mode: "0644"
