---
- name: Write the required secrets that were given
  ansible.builtin.copy:
    dest: "{{ _ansibled_h_secrets }}/{{ item.name }}"
    content: "{{ _ansibled_secret_values[item.name] }}"
    owner: "{{ ansibled_uid }}"
    group: "{{ ansibled_gid }}"
    mode: "0400"
  loop: "{{ _ansibled_required_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  when: _ansibled_secret_values[item.name] | length > 0
  no_log: true
  notify: ansibled restart

# Candidates are only written when the key is not given and the file does
# not exist yet, so reruns keep the value already on the host.
- name: Generate candidate values for the optional secrets
  ansible.builtin.set_fact:
    _ansibled_generated:
      webhook_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      metrics_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
      session_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=48, chars=['ascii_letters', 'digits']) }}"
  no_log: true

- name: Write the optional secrets
  ansible.builtin.copy:
    dest: "{{ _ansibled_h_secrets }}/{{ item.name }}"
    content: "{{ _ansibled_secret_values[item.name] or _ansibled_generated[item.name] }}"
    force: "{{ _ansibled_secret_values[item.name] | length > 0 }}"
    owner: "{{ ansibled_uid }}"
    group: "{{ ansibled_gid }}"
    mode: "0400"
  loop: "{{ _ansibled_optional_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  register: _ansibled_optional_secrets_result
  no_log: true
  notify: ansibled restart

- name: Check for the secrets directory
  ansible.builtin.stat:
    path: "{{ _ansibled_h_secrets }}"
  register: _ansibled_secrets_dir

- name: Generate the SSH key pair
  community.crypto.openssh_keypair:
    path: "{{ _ansibled_h_secrets }}/ssh_key"
    type: ed25519
    comment: "{{ ansibled_ssh_key_comment }}"
    owner: "{{ ansibled_uid }}"
    group: "{{ ansibled_gid }}"
    mode: "0400"
  # In check mode on the first run the directory does not exist yet.
  when: _ansibled_secrets_dir.stat.exists

# In check mode on the very first run these files do not exist yet.
- name: Read the public key
  ansible.builtin.slurp:
    src: "{{ _ansibled_h_secrets }}/ssh_key.pub"
  register: _ansibled_pubkey_slurp
  failed_when: _ansibled_pubkey_slurp.content is not defined and not ansible_check_mode

- name: Set ansibled_public_key
  ansible.builtin.set_fact:
    ansibled_public_key: "{{ _ansibled_pubkey_slurp.content | b64decode | trim }}"
  when: _ansibled_pubkey_slurp.content is defined

- name: Read the effective webhook secret and metrics token
  ansible.builtin.slurp:
    src: "{{ _ansibled_h_secrets }}/{{ item }}"
  loop: [webhook_secret, metrics_token]
  register: _ansibled_secret_slurp
  failed_when: _ansibled_secret_slurp.content is not defined and not ansible_check_mode
  no_log: true

- name: Set ansibled_webhook_secret_effective and ansibled_metrics_token_effective
  ansible.builtin.set_fact:
    ansibled_webhook_secret_effective: >-
      {{ (_ansibled_secret_slurp.results[0].content | b64decode | trim)
         if _ansibled_secret_slurp.results[0].content is defined
         else (_ansibled_secret_values.webhook_secret or _ansibled_generated.webhook_secret) }}
    ansibled_metrics_token_effective: >-
      {{ (_ansibled_secret_slurp.results[1].content | b64decode | trim)
         if _ansibled_secret_slurp.results[1].content is defined
         else (_ansibled_secret_values.metrics_token or _ansibled_generated.metrics_token) }}
  no_log: true
