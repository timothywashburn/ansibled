---
# present: create the user, key and sudo rule. absent: remove all of it.
ansibled_target_state: present

# Local (system) account ansibled logs in as. It lives in /etc/passwd, never in a
# directory service, so it keeps working when FreeIPA/LDAP is down.
ansibled_target_user: ansibled
# On SELinux hosts keep it where the policy labels <home>/.ssh as ssh_home_t
# (e.g. /var/lib/<name> or /home/<name>).
ansibled_target_home: /var/lib/ansibled

# Where the daemon's SSH public key comes from. Either set the inventory
# hostname of the host running the ansibled daemon (the key is read from
# <controller_dir>/etc/secrets/ssh_key.pub there, as root):
# ansibled_target_controller: ansible-controller
# or give the key itself (several keys: one per line), which takes precedence:
# ansibled_target_public_key: "ssh-ed25519 AAAA... ansibled"
# The ansibled_dir used on the controller: its ansibled_dir from the
# inventory when set there, else the ansibled role's default.
ansibled_target_controller_dir: >-
  {{ hostvars[ansibled_target_controller].ansibled_dir | default('/opt/ansibled')
     if ansibled_target_controller | default('') | length > 0 and ansibled_target_controller in hostvars
     else '/opt/ansibled' }}

# Addresses/CIDRs/patterns the key may be used from (sshd "from=" option).
# Empty: no restriction.
ansibled_target_from: []
