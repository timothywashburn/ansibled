---
# present: create the user, key and sudo rule. absent: remove all of it.
ansibled_target_state: present

# Local (system) account ansibled logs in as. It lives in /etc/passwd, never in a
# directory service, so it keeps working when FreeIPA/LDAP is down.
ansibled_target_user: ansibled
# On SELinux hosts keep it where the policy labels <home>/.ssh as ssh_home_t
# (e.g. /var/lib/<name> or /home/<name>).
ansibled_target_home: /var/lib/ansibled

# Required: the daemon's SSH public key, e.g.
# "{{ hostvars[groups['ansibled'][0]].ansibled_public_key }}".
# ansibled_target_public_key:

# Addresses/CIDRs/patterns the key may be used from (sshd "from=" option).
# Empty: no restriction.
ansibled_target_from: []
