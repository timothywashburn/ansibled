---
argument_specs:
  main:
    short_description: Prepare a host to be managed by ansibled.
    description:
      - Creates a local system user with an SSH key and passwordless sudo,
        so ansibled can run C(ansible-playbook --check) against the host.
      - With O(ansibled_target_state=absent), removes the user, its home,
        and the sudoers file again.
    options:
      ansibled_target_state:
        type: str
        default: present
        choices: [present, absent]
        description: Whether the ansibled account should exist.
      ansibled_target_user:
        type: str
        default: ansibled
        description: Name of the local system user.
      ansibled_target_home:
        type: path
        default: /var/lib/ansibled
        description:
          - Home directory of the user (created with mode 0700).
          - On SELinux hosts it must be somewhere the policy labels C(<home>/.ssh) as C(ssh_home_t), such as C(/var/lib/<name>).
      ansibled_target_public_key:
        type: str
        description:
          - The ansibled daemon's SSH public key. Required when O(ansibled_target_state=present).
          - C(authorized_keys) is managed exclusively, other keys are removed.
      ansibled_target_from:
        type: list
        elements: str
        default: []
        description:
          - Source addresses, CIDRs or host patterns the key may be used from.
          - When not empty, every key gets the C(from="...") option.
