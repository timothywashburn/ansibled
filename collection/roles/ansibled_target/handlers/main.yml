---
- name: Restore SELinux context of the ansibled .ssh directory
  ansible.builtin.command:
    argv: [restorecon, -R, -v, "{{ ansibled_target_home }}/.ssh"]
  register: _ansibled_target_restorecon
  changed_when: _ansibled_target_restorecon.stdout | length > 0
  when:
    - ansibled_target_manage_selinux | bool
    - (ansible_facts.selinux.status | default('disabled')) == 'enabled'
  listen: ansibled_target restorecon
