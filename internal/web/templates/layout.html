<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{{.Title}} · ansibled · {{.Site}}</title>
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "app.js"}}" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><img src="{{asset "icon.svg"}}" alt="" width="20" height="20"><span>ansibled</span></a>
  <span class="site-chip" title="site">{{.Site}}</span>
  {{- if .User}}
  <nav class="mainnav">
    <a href="/"{{if eq .Nav "overview"}} class="on" aria-current="page"{{end}}>Overview</a>
    <a href="/runs"{{if eq .Nav "runs"}} class="on" aria-current="page"{{end}}>Runs</a>
  </nav>
  <span class="who">{{icon "user"}}<span>{{.User}}</span><a href="/logout">Sign out</a></span>
  {{- end}}
</header>
<main class="{{if eq .Nav "runs"}}wide{{end}}">
{{template "content" .}}
</main>
</body>
</html>
